name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Check public boundary
        run: scripts/check-public-boundary.sh

      - name: Validate all storage modes
        run: |
          docker compose config --quiet
          docker compose -f compose.yaml -f compose.local.yaml config --quiet
          docker compose --profile local-db config --quiet
          docker compose --profile local-objects config --quiet
          docker compose --profile analytics config --quiet
          docker compose --profile inference-gpu config --quiet
          docker compose --profile observability config --quiet
          docker compose \
            --profile local-db --profile local-objects \
            --profile analytics --profile inference-gpu \
            config --quiet
          AIRFLOW_OTEL_ENABLED=true docker compose \
            --profile local-db --profile local-objects --profile observability \
            config --quiet
          LANGFUSE_ENV_FILE=langfuse.env.example docker compose \
            -f compose.yaml -f compose.langfuse.yaml \
            --profile local-db --profile local-objects \
            --profile observability --profile llm-observability \
            config --quiet
          N8N_ENV_FILE=n8n.env.example docker compose \
            -f compose.yaml -f compose.n8n.yaml \
            --profile local-db --profile automation \
            config --quiet

      - name: Test launcher
        run: |
          python -m unittest discover -s tests
          sh -n scripts/check-vllm-contract.sh scripts/check-n8n-contract.sh

      - name: Build image
        run: docker build -t etl-workbench:local .

      - name: Check installed packages
        run: docker compose run --rm airflow python -m pip check

      - name: Import example DAGs
        run: >-
          docker compose -f compose.yaml -f compose.local.yaml run --rm airflow python -c
          'from airflow.models import DagBag;
          bag = DagBag("/opt/airflow/dags");
          assert not bag.import_errors, bag.import_errors;
          assert {"workbench_runtime_smoke", "workbench_storage_smoke"} <= set(bag.dags)'

      - name: Run full local smoke
        run: |
          docker compose -f compose.yaml -f compose.local.yaml run \
            --rm --no-deps \
            -e AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=sqlite:////var/lib/airflow/airflow.db \
            airflow airflow db migrate
          docker compose -f compose.yaml -f compose.local.yaml run \
            --rm --no-deps \
            -e AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=sqlite:////var/lib/airflow/airflow.db \
            airflow airflow connections add metadata_migration_smoke \
            --conn-json '{"conn_type":"http","host":"https://example.invalid"}'
          docker compose -f compose.yaml -f compose.local.yaml \
            --profile local-db --profile local-objects --profile analytics \
            up -d --wait
          EXPECTED_AIRFLOW_CONNECTION_ID=metadata_migration_smoke \
            scripts/check-airflow-metadata-contract.sh
          scripts/check-clickhouse-contract.sh
          docker compose -f compose.yaml -f compose.local.yaml exec airflow airflow dags test workbench_runtime_smoke 2026-01-01
          docker compose -f compose.yaml -f compose.local.yaml exec airflow airflow dags test workbench_storage_smoke 2026-01-01
          docker compose -f compose.yaml -f compose.local.yaml \
            --profile local-db --profile local-objects --profile analytics \
            down --volumes

      - name: Run native Git bundle smoke
        env:
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.clone_url }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          repository="${HEAD_REPOSITORY:-https://github.com/${GITHUB_REPOSITORY}.git}"
          ref="${HEAD_REF:-${GITHUB_REF_NAME}}"
          ./bin/etl-workbench "$repository" \
            --ref "$ref" \
            --subdir example-pipeline/dags \
            --image etl-workbench:local \
            --analytics \
            --automation \
            --llm-observability
          for attempt in $(seq 1 20); do
            if docker compose exec airflow airflow dags list | grep -q workbench_runtime_smoke; then
              break
            fi
            if [ "$attempt" -eq 20 ]; then
              exit 1
            fi
            sleep 3
          done
          docker compose exec airflow airflow dags list | grep pipeline
          docker compose exec airflow airflow dags test workbench_runtime_smoke 2026-01-02
          scripts/check-airflow-metadata-contract.sh
          scripts/check-clickhouse-contract.sh
          scripts/check-otel-contract.sh
          scripts/check-langfuse-contract.sh
          scripts/check-n8n-contract.sh

      - name: Show service logs after failure
        if: failure()
        run: |
          LANGFUSE_ENV_FILE=langfuse.env.example \
            N8N_ENV_FILE=n8n.env.example \
            docker compose \
            -f compose.yaml -f compose.local.yaml \
            -f compose.langfuse.yaml -f compose.n8n.yaml \
            --profile local-db --profile local-objects \
            --profile analytics --profile automation \
            --profile observability --profile llm-observability \
            logs --no-color

      - name: Remove disposable volumes
        if: always()
        run: |
          LANGFUSE_ENV_FILE=langfuse.env.example \
            N8N_ENV_FILE=n8n.env.example \
            docker compose \
            -f compose.yaml -f compose.local.yaml \
            -f compose.langfuse.yaml -f compose.n8n.yaml \
            --profile local-db --profile local-objects \
            --profile analytics --profile automation \
            --profile observability --profile llm-observability \
            down --volumes --remove-orphans
