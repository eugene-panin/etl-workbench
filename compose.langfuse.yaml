x-langfuse-env-file: &langfuse-env-file
  - path: ${LANGFUSE_ENV_FILE:-./langfuse.env}
    required: true

x-langfuse-dependencies: &langfuse-dependencies
  langfuse-init:
    condition: service_completed_successfully
  langfuse-clickhouse:
    condition: service_healthy
  langfuse-redis:
    condition: service_healthy

services:
  langfuse-init:
    image: ${AIRFLOW_IMAGE:-etl-workbench:local}
    profiles: ["llm-observability"]
    restart: "no"
    env_file: *langfuse-env-file
    command: ["python", "/opt/workbench/scripts/init-langfuse.py"]
    volumes:
      - ./scripts:/opt/workbench/scripts:ro
    depends_on:
      postgres:
        condition: service_healthy
      object-store:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    networks:
      - workbench

  langfuse-clickhouse:
    image: docker.io/clickhouse/clickhouse-server:25.12@sha256:8a790dd3468db22b1d4e7b18a176f378ff5ff6053b9c48dd4ea1fa71a24c5ba6
    profiles: ["llm-observability"]
    restart: unless-stopped
    user: "101:101"
    env_file: *langfuse-env-file
    environment:
      CLICKHOUSE_DB: default
    volumes:
      - langfuse-clickhouse:/var/lib/clickhouse
      - langfuse-clickhouse-logs:/var/log/clickhouse-server
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8123/ping"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    security_opt:
      - no-new-privileges:true
    networks:
      - workbench

  langfuse-redis:
    image: docker.io/redis:7-alpine@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2
    profiles: ["llm-observability"]
    restart: unless-stopped
    env_file: *langfuse-env-file
    command:
      - sh
      - -ec
      - exec redis-server --requirepass "$$REDIS_AUTH" --maxmemory-policy noeviction
    volumes:
      - langfuse-redis:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_AUTH\" ping 2>/dev/null | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    security_opt:
      - no-new-privileges:true
    networks:
      - workbench

  langfuse-worker:
    image: docker.io/langfuse/langfuse-worker:4@sha256:61e9f83f5f1e5b6f8745215db193f5d201b4cba9ed543e539104552c1b3dc106
    profiles: ["llm-observability"]
    restart: unless-stopped
    env_file: *langfuse-env-file
    depends_on: *langfuse-dependencies
    expose:
      - "3030"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - const h=require("os").hostname();fetch("http://"+h+":3030/api/health").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 90s
    security_opt:
      - no-new-privileges:true
    networks:
      - workbench

  langfuse-web:
    image: docker.io/langfuse/langfuse:4@sha256:cff59a366f9773f9e1d7060655cc63441b1e4ad27e8ad40ebdaebe2151a014cb
    profiles: ["llm-observability"]
    restart: unless-stopped
    env_file: *langfuse-env-file
    environment:
      LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://127.0.0.1:${LOCAL_S3_PORT:-${MINIO_API_PORT:-59000}}
    depends_on: *langfuse-dependencies
    ports:
      - "127.0.0.1:${LANGFUSE_UI_PORT:-18082}:3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - const h=require("os").hostname();fetch("http://"+h+":3000/api/public/ready").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 90s
    security_opt:
      - no-new-privileges:true
    networks:
      - workbench

volumes:
  langfuse-clickhouse:
  langfuse-clickhouse-logs:
  langfuse-redis:
