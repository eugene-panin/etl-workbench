name: etl-workbench

x-airflow-environment: &airflow-environment
  AIRFLOW_HOME: /var/lib/airflow
  AIRFLOW__API__HOST: 0.0.0.0
  AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
  AIRFLOW__CORE__EXECUTOR: LocalExecutor
  AIRFLOW__CORE__LOAD_EXAMPLES: "false"
  AIRFLOW__CORE__PARALLELISM: "4"
  AIRFLOW__CORE__TEST_CONNECTION: Enabled
  AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: ${AIRFLOW_METADATA_DATABASE_URL:-postgresql+psycopg2://etl:etl-local@postgres:5432/airflow}
  AIRFLOW__METRICS__METRICS_ALLOW_LIST: ${AIRFLOW_OTEL_METRICS_ALLOW_LIST:-scheduler,executor,dagrun,pool,ti,task,operator}
  AIRFLOW__METRICS__OTEL_ON: ${AIRFLOW_OTEL_ENABLED:-false}
  AIRFLOW__METRICS__OTEL_PREFIX: airflow
  AIRFLOW__TRACES__OTEL_ON: ${AIRFLOW_OTEL_ENABLED:-false}
  AIRFLOW__TRACES__TASK_RUNNER_FLUSH_TIMEOUT_MILLISECONDS: "30000"
  AIRFLOW_CONN_LOCAL_POSTGRES: ${AIRFLOW_CONN_LOCAL_POSTGRES:-postgresql://etl:etl-local@postgres:5432/etl}
  AIRFLOW_CONN_LOCAL_S3: ${AIRFLOW_CONN_LOCAL_S3:-{"conn_type":"aws","login":"minio-local","password":"minio-local-secret","extra":{"endpoint_url":"http://object-store:8333","region_name":"us-east-1","config_kwargs":{"s3":{"addressing_style":"path"}}}}}
  AIRFLOW_CONN_LOCAL_CLICKHOUSE: ${AIRFLOW_CONN_LOCAL_CLICKHOUSE:-{"conn_type":"http","host":"analytics-clickhouse","login":"analytics","password":"analytics-local","schema":"analytics","port":8123}}
  AIRFLOW_CONN_LLM_LOCAL_VLLM: ${AIRFLOW_CONN_LLM_LOCAL_VLLM:-{"conn_type":"openai","password":"vllm-local","host":"http://vllm:8000/v1"}}
  ETL_LOCAL_BUCKET: ${ETL_LOCAL_BUCKET:-etl-local}
  OTEL_EXPORTER_OTLP_ENDPOINT: http://clickstack:4317
  OTEL_EXPORTER_OTLP_HEADERS: authorization=${CLICKSTACK_INGESTION_KEY:-etl-workbench-local}
  OTEL_EXPORTER_OTLP_INSECURE: "true"
  OTEL_EXPORTER_OTLP_PROTOCOL: grpc
  OTEL_LOGS_EXPORTER: none
  OTEL_METRIC_EXPORT_INTERVAL: ${OTEL_METRIC_EXPORT_INTERVAL:-30000}
  OTEL_RESOURCE_ATTRIBUTES: ${OTEL_RESOURCE_ATTRIBUTES:-service.namespace=etl-workbench,deployment.environment.name=local}
  OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-etl-workbench-airflow}
  PYTHONPATH: /opt/pipeline/src
  VLLM_SERVED_MODEL_NAME: ${VLLM_SERVED_MODEL_NAME:-local-model}

services:
  airflow:
    image: ${AIRFLOW_IMAGE:-etl-workbench:local}
    command: ["airflow", "standalone"]
    restart: unless-stopped
    env_file:
      - path: ${WORKBENCH_ENV_FILE:-./workbench.env}
        required: false
      - path: ${PIPELINE_ENV_FILE:-./pipeline.env}
        required: false
    environment:
      <<: *airflow-environment
    ports:
      - "${AIRFLOW_UI_HOST:-127.0.0.1}:${AIRFLOW_UI_PORT:-18080}:8080"
    volumes:
      - airflow-home:/var/lib/airflow
    depends_on:
      airflow-metadata-init:
        condition: service_completed_successfully
        required: false
      postgres:
        condition: service_healthy
        required: false
      object-store:
        condition: service_healthy
        required: false
      analytics-clickhouse:
        condition: service_healthy
        required: false
      vllm:
        condition: service_healthy
        required: false
      clickstack:
        condition: service_healthy
        required: false
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import json, urllib.request;
          health=json.load(urllib.request.urlopen("http://127.0.0.1:8080/api/v2/monitor/health", timeout=4));
          required=("metadatabase", "scheduler", "triggerer", "dag_processor");
          assert all(health.get(component, {}).get("status") == "healthy" for component in required), health
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 45s
    networks:
      - workbench

  airflow-db-create:
    image: postgres:17.5-alpine@sha256:6567bca8d7bc8c82c5922425a0baee57be8402df92bae5eacad5f01ae9544daa
    profiles: ["local-db"]
    restart: "no"
    environment:
      PGPASSWORD: etl-local
    command:
      - sh
      - -ec
      - >-
        psql --host postgres --username etl --dbname postgres
        --tuples-only --no-align
        --command "SELECT 1 FROM pg_database WHERE datname = 'airflow'"
        | grep -q 1
        || createdb --host postgres --username etl airflow
    depends_on:
      postgres:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    networks:
      - workbench

  airflow-metadata-init:
    image: ${AIRFLOW_IMAGE:-etl-workbench:local}
    profiles: ["local-db"]
    restart: "no"
    environment:
      AIRFLOW_HOME: /var/lib/airflow
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: ${AIRFLOW_METADATA_DATABASE_URL:-postgresql+psycopg2://etl:etl-local@postgres:5432/airflow}
    command:
      - python
      - /opt/workbench/scripts/migrate-airflow-metadata.py
    volumes:
      - airflow-home:/var/lib/airflow
      - ./scripts:/opt/workbench/scripts:ro
    depends_on:
      airflow-db-create:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    networks:
      - workbench

  postgres:
    image: postgres:17.5-alpine@sha256:6567bca8d7bc8c82c5922425a0baee57be8402df92bae5eacad5f01ae9544daa
    profiles: ["local-db"]
    environment:
      POSTGRES_DB: etl
      POSTGRES_USER: etl
      POSTGRES_PASSWORD: etl-local
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U etl -d etl"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - workbench

  clickstack:
    image: clickhouse/clickstack-all-in-one:2.32.0@sha256:54a0a805d761d6fef76122736a0d62400b78f69bd00394fe15086c8eda39b6c7
    profiles: ["observability"]
    restart: unless-stopped
    environment:
      INGESTION_API_KEY: ${CLICKSTACK_INGESTION_KEY:-etl-workbench-local}
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:${CLICKSTACK_UI_PORT:-18081}:8080"
    volumes:
      - clickstack-mongodb:/data/db
      - clickstack-clickhouse:/var/lib/clickhouse
      - clickstack-clickhouse-logs:/var/log/clickhouse-server
    tmpfs:
      - /var/log:size=256m,mode=1777
    expose:
      - "4317"
      - "4318"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/api/health"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s
    networks:
      - workbench

  object-store:
    image: chrislusf/seaweedfs:4.40@sha256:52194fba4fecd0083c842158b3a902ba6e04a63619b2b0efcd08007bdb6a4602
    profiles: ["local-objects"]
    command:
      - mini
      - -dir=/data
      - -master.telemetry=false
      - -webdav=false
      - -admin.ui=false
      - -s3.port.iceberg=0
    environment:
      AWS_ACCESS_KEY_ID: minio-local
      AWS_SECRET_ACCESS_KEY: minio-local-secret
      S3_BUCKET: ${ETL_LOCAL_BUCKET:-etl-local}
    ports:
      - "127.0.0.1:${LOCAL_S3_PORT:-${MINIO_API_PORT:-59000}}:8333"
    volumes:
      - seaweedfs-data:/data
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          curl --fail --silent http://127.0.0.1:9333/cluster/status >/dev/null
          && curl --fail --silent http://127.0.0.1:9333/dir/status
          | grep -Eq '"Free":[1-9][0-9]*'
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - workbench

  analytics-clickhouse:
    image: clickhouse/clickhouse-server:26.7.1.1315-alpine@sha256:79b3b3d5765447b928473d0f510e000c5738d066bc018b5e8a105a7c57b1e345
    profiles: ["analytics"]
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: analytics
      CLICKHOUSE_USER: analytics
      CLICKHOUSE_PASSWORD: analytics-local
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports:
      - "127.0.0.1:${CLICKHOUSE_HTTP_PORT:-18123}:8123"
    volumes:
      - analytics-clickhouse-data:/var/lib/clickhouse
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          clickhouse-client
          --host 127.0.0.1
          --user "$$CLICKHOUSE_USER"
          --password "$$CLICKHOUSE_PASSWORD"
          --query "SELECT 1"
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    security_opt:
      - no-new-privileges:true
    networks:
      - workbench

  vllm:
    image: vllm/vllm-openai:v0.26.0-ubuntu2404@sha256:ef7bfc14df9233e3e5d41e733e3be0afa6abbe5ae5f14ee0758110030f6cd53e
    profiles: ["inference-gpu"]
    restart: unless-stopped
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
      VLLM_NO_USAGE_STATS: "1"
    command:
      - --model
      - ${VLLM_MODEL:-Qwen/Qwen3-0.6B}
      - --served-model-name
      - ${VLLM_SERVED_MODEL_NAME:-local-model}
      - --api-key
      - ${VLLM_API_KEY:-vllm-local}
      - --gpu-memory-utilization
      - ${VLLM_GPU_MEMORY_UTILIZATION:-0.92}
    ports:
      - "127.0.0.1:${VLLM_HTTP_PORT:-18000}:8000"
    volumes:
      - vllm-huggingface-cache:/root/.cache/huggingface
    shm_size: ${VLLM_SHM_SIZE:-8gb}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: ${VLLM_GPU_COUNT:-1}
              capabilities: [gpu]
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen("http://127.0.0.1:8000/health", timeout=4)
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 180s
    security_opt:
      - no-new-privileges:true
    networks:
      - workbench

volumes:
  analytics-clickhouse-data:
  airflow-home:
  clickstack-clickhouse:
  clickstack-clickhouse-logs:
  clickstack-mongodb:
  postgres-data:
  seaweedfs-data:
  vllm-huggingface-cache:

networks:
  workbench:
    driver: bridge
